services:
  # ── Backend: Express API ──
  - type: web
    name: mailcerti-backend
    runtime: node
    rootDir: .
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false   # set manually in Render dashboard
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false   # set manually in Render dashboard
      - key: SMTP_PASS
        sync: false   # set manually in Render dashboard
      - key: FROM_NAME
        value: Event Management Team
      - key: FROM_EMAIL
        sync: false   # set manually in Render dashboard
      - key: WEBHOOK_SECRET
        value: mailcerti_wh_secret_2025
      - key: GEMINI_API_KEY
        sync: false   # set manually in Render dashboard
      - key: FRONTEND_URL
        sync: false   # set to your Render frontend URL after deploy

  # ── Frontend: Vite/React Static Site ──
  - type: static
    name: mailcerti-frontend
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_BACKEND_URL
        sync: false   # set to your Render backend URL after deploy
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
